# coturn configuration for the BoardMeet video relay (TURN server).
# Replace every <PLACEHOLDER> before starting, then run docker compose up -d.

# --- Listening ------------------------------------------------------------
listening-port=3478
# tls-listening-port=5349            # uncomment (and add cert/pkey below) for turns:

fingerprint
lt-cred-mech

# --- Credentials ----------------------------------------------------------
# This user/password MUST match TURN_USERNAME / TURN_CREDENTIAL in the app's .env.
# Pick a long random secret.
user=boardmeet:<STRONG_SHARED_SECRET>
realm=boardmeet

# --- Networking -----------------------------------------------------------
# The address clients use to reach THIS server:
#  - Remote/internet participants: your server's PUBLIC IP (and forward the ports).
#  - LAN/VPN-only deployment: the server's LAN IP (e.g. 172.20.0.x).
external-ip=<PUBLIC_OR_LAN_IP>

# UDP relay port range — OPEN THESE ON THE FIREWALL (udp), plus 3478 tcp+udp.
min-port=49160
max-port=49200

# --- Hardening ------------------------------------------------------------
no-cli
no-multicast-peers
stale-nonce=600
# For a PUBLIC TURN server, block relaying to private ranges (prevents abuse).
# DO NOT enable these on a LAN-only server (you need private ranges there):
# denied-peer-ip=10.0.0.0-10.255.255.255
# denied-peer-ip=172.16.0.0-172.31.255.255
# denied-peer-ip=192.168.0.0-192.168.255.255

# --- TLS (optional, recommended for internet use) -------------------------
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
